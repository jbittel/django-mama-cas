language: python

matrix:
  include:
    - env: TOX_ENV=py39-djangomain
      python: 3.9
    - env: TOX_ENV=py38-djangomain
      python: 3.8
    - env: TOX_ENV=py310-django32
      python: "3.10"
    - env: TOX_ENV=py39-django32
      python: 3.9
    - env: TOX_ENV=py38-django32
      python: 3.8
    - env: TOX_ENV=flake8
    - env: TOX_ENV=docs

  allow_failures:
    - env: TOX_ENV=py39-djangomain
      python: 3.9
    - env: TOX_ENV=py38-djangomain
      python: 3.8

install: pip install tox

script: tox -e $TOX_ENV
